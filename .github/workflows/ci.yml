name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  quality:
    name: Lint, types et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test -- --ci

      - name: Cohérence du projet Expo
        run: npx expo-doctor
